docker:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  interruptible: true
  rules:
    - changes:
      - Dockerfile
    - if: $CI_COMMIT_REF_NAME !~ /main/
      when: never
  before_script:
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor --registry-mirror regmirror.embl.de --cache=true --build-arg "GITLAB_CI=$GITLAB_CI" --build-arg "CI_COMMIT_SHORT_SHA=$CI_COMMIT_SHORT_SHA"
      --build-arg "CI_COMMIT_SHA=$CI_COMMIT_SHA" --context "$CI_PROJECT_DIR" --dockerfile Dockerfile --destination "$CI_REGISTRY_IMAGE/pytest:latest"

test:
  image: "$CI_REGISTRY_IMAGE/pytest:latest"
  script:
    - pytest